<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="كتالوج علاجات وتحاليل شخصي — يعمل بلا إنترنت، بياناتك على جهازك فقط">
<!-- لا روابط لملفات خارجية: أيقونة التطبيق تأتي من موارد أندرويد، وأي مرجع
     مفقود هنا يُنتج طلبًا فاشلًا في WebView بلا فائدة. -->
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليلي">
<title>دليلي الطبي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:Tahoma,Arial,sans-serif;direction:rtl;background:#f0fdfa;font-size:15px;color:#0f172a;font-weight:500}
:root{--teal:#0f766e;--teal2:#075e54;--teal3:#14b8a6;--border:#e2e8f0;--mid:#64748b;--light:#94a3b8;--red:#dc2626}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

.scr{display:none;min-height:100vh}
.scr.on{display:block}

/* شاشة القفل */
#lock.on{display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,var(--teal2),var(--teal))}
.lockbox{background:#fff;border-radius:20px;padding:32px 24px;width:88%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lockicon{font-size:42px;margin-bottom:8px}
.lt{font-weight:800;font-size:16px;margin-bottom:16px}
.pin-inp{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:12px;font-size:22px;text-align:center;letter-spacing:6px;outline:none}
.pin-inp:focus{border-color:var(--teal)}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px;font-weight:700}

/* شاشة الإنقاذ — حين تتعذّر قراءة القاعدة */
.lockbox.rec{text-align:right;max-width:380px;max-height:88vh;overflow:auto}
.rec-note{font-size:13px;line-height:1.9;color:#334155;background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.rec-h{font-size:12.5px;font-weight:800;color:var(--mid);margin:16px 0 4px}
.rec-d{margin-top:14px;font-size:12px;color:var(--light)}
.rec-d summary{cursor:pointer}
.rec-e{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:11px;color:var(--mid);background:#f8fafc;border-radius:8px;padding:8px;text-align:left;direction:ltr}

/* الترويسة */
.hdr{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(7,94,84,.25)}
.hdr-t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.hdr-b{background:rgba(255,255,255,.16);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}

/* الدرج الجانبي — المجموعات من أي صفحة. يأتي من اليمين لأن الواجهة RTL */
.dw-bg{display:none;position:fixed;inset:0;z-index:600;background:rgba(15,23,42,.5)}
.dw-bg.on{display:block}
.dw{position:fixed;top:0;right:0;bottom:0;z-index:601;width:86%;max-width:340px;background:#f8fafc;
    box-shadow:-8px 0 30px rgba(0,0,0,.2);overflow-y:auto;padding:14px;
    transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
.dw.on{transform:translateX(0);visibility:visible}
.dw-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dw-hd b{font-size:15.5px}
/* بطاقة المجموعة: إجراءاتها الثلاثة مكتوبة في سطر تحتها */
.gcard .gacts{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.gcard .gacts .btn{flex:1;margin:0;padding:9px 4px;font-size:12.5px;white-space:nowrap}

/* صندوق ما لا رجعة فيه */
.dz{background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px 13px;margin-bottom:10px}
.dz-h{font-weight:800;font-size:13.5px;color:#b91c1c;margin-bottom:6px}
.dz-l{margin:0;padding-right:18px;font-size:13.5px;color:#7f1d1d;line-height:1.9}
.dz-w{margin-top:8px;font-size:12.5px;font-weight:800;color:#b91c1c}
.dz-k{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:11px;padding:9px 12px;
      font-size:12.5px;font-weight:700;color:var(--teal2)}
.btn.danger[disabled]{opacity:.4}

/* زرّ ظهور الحقل في العرض والإرسال */
.eye{flex:none;width:40px;height:40px;border-radius:11px;border:1.5px solid var(--border);
     background:#f8fafc;font-size:17px;cursor:pointer;line-height:1}
.eye.on{background:#ecfdf5;border-color:var(--teal3)}
.eye.lock{display:flex;align-items:center;justify-content:center;cursor:default;opacity:.75}
.chk-row.locked{color:var(--mid);font-weight:700}

/* زرّ الترتيب وصفحته */
.sort-entry{margin-bottom:10px;font-weight:800}
.sortcat{margin-bottom:14px}
.sortcat-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;
           color:var(--teal2);background:#ecfdf5;border-radius:11px;padding:8px 11px;margin-bottom:6px}
.ic.big{width:40px;height:40px;font-size:17px}

/* شريط الوضعين: إرسال أم إدخال — أوّل ما تراه في كل قسم */
.modebar{display:flex;gap:6px;background:#e2e8f0;border-radius:13px;padding:4px;margin-bottom:6px}
.mb{flex:1;border:none;background:transparent;border-radius:10px;padding:10px 6px;cursor:pointer;
    font:inherit;font-weight:800;font-size:13.5px;color:var(--mid);white-space:nowrap}
.mb.on{background:#fff;color:var(--teal2);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.modehint{font-size:12px;color:var(--light);text-align:center;margin-bottom:10px;font-weight:600}
.etools{display:flex;gap:6px;margin:-4px 0 10px}
.etools .btn{flex:1;margin:0;padding:8px 4px;font-size:12.5px;white-space:nowrap}

/* المعاينة: قائمة تأشير لما يُرسَل الآن */
.pvsel{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pvsel .btn{margin:0}
.pvsel-n{margin-right:auto;font-weight:800;font-size:13px;color:var(--teal)}
.pvck{flex:none;display:flex;align-items:center}
.pvck input{width:21px;height:21px;accent-color:var(--teal)}
.pvrow .grow{cursor:pointer}
.pvrow.off{opacity:.45}
.pvrow.off .name{text-decoration:line-through}

.dw-g{font-size:12px;font-weight:800;color:var(--mid);margin:16px 0 6px}
.dw-g:first-child{margin-top:0}
.dwi{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--border);
     border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer;font:inherit;text-align:right}
.dwi-i{font-size:18px;flex:none}
.dwi-t{flex:1;font-weight:700;font-size:14px;color:#0f172a}
.dwi-n{flex:none;font-size:12px;font-weight:800;color:var(--teal);background:#ecfdf5;border-radius:8px;padding:2px 8px}
/* القسم في القائمة: رأسٌ يطوي، وتحته أعماله */
.dws{margin-bottom:6px}
.dws summary{list-style:none;margin:0}
.dws summary::-webkit-details-marker{display:none}
.dws-a{flex:none;color:var(--light);font-size:12px;transition:transform .15s}
.dws[open] .dws-a{transform:rotate(180deg)}
.dws[open]>summary{border-color:var(--teal3);background:#ecfdf5}
.dws-b{padding:6px 10px 2px 10px}
.dwa{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--border);
     border-radius:10px;padding:10px 12px;margin-bottom:5px;font:inherit;font-size:13px;
     font-weight:700;color:#0f172a;cursor:pointer}
.dwa.sub{margin-right:14px;width:calc(100% - 14px);background:#f8fafc;font-size:12.5px;color:var(--mid)}

#page{padding:12px 12px 100px}

/* الصفحة الرئيسية */
.hero{background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;border-radius:16px;padding:18px 16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(7,94,84,.22)}
.hero-t{font-weight:800;font-size:17px;margin-bottom:5px}
.hero-s{font-size:12.5px;line-height:1.75;opacity:.9}
.hbar{background:#fff;border:1.5px solid var(--teal);border-radius:13px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:800;font-size:13px;color:var(--teal2)}
.hbar .btn{border:1.5px solid var(--border)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:15px 13px;font-family:inherit;text-align:right;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.hcard:active{border-color:var(--teal);transform:scale(.98)}
.hci{font-size:26px;margin-bottom:4px}
.hct{font-weight:800;font-size:14.5px;color:#0f172a}
.hcs{font-size:12px;color:var(--mid);font-weight:600}
.hcard.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px}
.hcard.wide .hci{margin-bottom:0}
.hcard.wide .hcs{margin-right:auto}

/* شريط الأدوات وحقل البحث */
/* شريط الأدوات: البحث سطرًا كاملًا والأزرار سطرًا تحته.
   كان الكل في سطر واحد، و<input> لا ينكمش دون عرض نصّه الإرشادي
   (min-width:auto الافتراضي) فيدفع الأزرار خارج الشاشة — و«+ إضافة»
   أوّل ما يختفي لأنه آخر الصفّ. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toolbar>*{min-width:0}
.toolbar .srch-inp{flex:1 1 100%}
.toolbar .btn{flex:1;white-space:nowrap;padding-left:4px;padding-right:4px;font-size:12.5px}
.srch-inp{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-family:inherit;font-size:14px;outline:none;background:#fff}
.srch-inp:focus{border-color:var(--teal)}

/* الأزرار */
.btn{padding:10px 16px;border-radius:11px;border:none;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.35)}
.btn.danger{background:#fef2f2;color:var(--red);border:1.5px solid #fecaca}
.btn.ghost{background:rgba(255,255,255,.2);color:#fff}
.btn.white{background:#fff;color:var(--teal2)}
.btn.wa{background:#25d366;color:#fff}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.full{width:100%;justify-content:center;margin-bottom:8px}
.btn:not(.primary):not(.danger):not(.ghost):not(.white):not(.wa){background:#fff;border:1.5px solid var(--border);color:#334155}

/* سلة التحديد */
.cartbar{position:sticky;top:70px;z-index:5;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;border-radius:13px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(7,94,84,.3);font-weight:800;font-size:13px}
.grow{flex:1}

/* البطاقات */
.card{background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card.sel{border-color:var(--teal)}
.row{display:flex;align-items:center;gap:10px}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex-shrink:0;cursor:pointer}
.name{font-weight:800;font-size:14px}
.sub{font-size:12px;color:var(--mid);margin-top:2px;white-space:pre-wrap}
.star{color:#f59e0b}
.ic{background:none;border:none;font-size:16px;padding:5px;cursor:pointer}
.ic[disabled]{opacity:.28;cursor:default}

/* فارغ */
.empty{text-align:center;padding:50px 16px;color:var(--light)}
.ei{font-size:42px;margin-bottom:10px}
.et{font-weight:800;font-size:14.5px;color:var(--mid)}
.es{font-size:12.5px;margin-top:4px}

/* أقسام قابلة للطي (تصنيفات التحاليل) */
.acc{border:1px solid var(--border);border-radius:13px;margin-bottom:9px;background:#fff;overflow:hidden}
/* «المزيد من الحقول» داخل النموذج — يبقى النموذج قصيرًا على الجوال */
.more{border:1.5px dashed var(--border);border-radius:11px;margin:4px 0 12px;background:#f8fafc}
.more summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:800;font-size:13px;color:var(--teal2)}
.more summary::-webkit-details-marker{display:none}
.more-b{padding:2px 11px 8px}
/* «إضافة حقل» داخل النموذج — تُميَّز عن الطيّة العادية لأنها إجراء لا حقول */
.more.addf{border-color:var(--teal3);background:#f0fdfa}
.more.addf summary{color:var(--teal2)}
.acc summary{list-style:none;cursor:pointer;padding:12px 13px;font-weight:800;font-size:13.5px;display:flex;align-items:center;background:linear-gradient(180deg,#f0fdfa,#fff)}
.acc summary::-webkit-details-marker{display:none}
.arrow{margin-right:auto;margin-left:0;color:var(--light);transition:transform .18s}
.acc[open] .arrow{transform:rotate(180deg)}
.acc-b{padding:6px}
.acc-b .card{margin:6px}

/* نموذج الإدخال */
.f{margin-bottom:11px}
.f label{display:block;font-size:12.5px;font-weight:800;color:var(--mid);margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;outline:none;background:#fff}
/* القائمة المنسدلة: سهم مرسوم يدويًا لأن مظهر النظام يختلف بين الأجهزة */
select.sel{appearance:none;-webkit-appearance:none;font-weight:700;cursor:pointer;padding-left:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--mid) 50%),linear-gradient(135deg,var(--mid) 50%,transparent 50%);
  background-position:14px calc(50% - 2px),19px calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.inp:focus{border-color:var(--teal)}
.ta{min-height:78px;resize:none;overflow:hidden;line-height:1.75}
/* شريط أدوات الحقل: إدراج نقاط وترقيم وسطر جديد */
.fbar{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.fb{background:#f0fdfa;border:1px solid var(--border);color:var(--teal2);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer}
.fb:active{background:var(--teal);color:#fff}
.fhint{font-size:11px;color:var(--light);margin-top:4px;line-height:1.6}
.chk-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:13px;cursor:pointer}
.chk-row input{width:19px;height:19px;accent-color:var(--teal)}
.mft{display:flex;gap:8px;margin-top:6px}
.mft .btn{flex:1;justify-content:center}

/* المودال */
.modal-bg{display:none;position:fixed;inset:0;z-index:500;background:rgba(15,23,42,.55);align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0;background:#fff;padding-bottom:8px}
.modal-hd b{font-size:15.5px}
.modal-x{background:none;border:none;font-size:20px;color:var(--light);cursor:pointer}

/* الإعدادات */
.settings-sec{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}
.settings-lbl{font-size:12px;font-weight:800;color:var(--mid);margin-bottom:8px}
.muted{font-size:12.5px;color:var(--light);line-height:1.7}
/* رقم الإصدار */
.ver{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:9px}
.ver-l{font-size:12.5px;font-weight:800;color:var(--mid)}
.ver-v{margin-right:auto;font-size:14px;font-weight:800;color:var(--teal2);direction:ltr}

/* المعاينة قبل الإرسال */
.pvtabs{display:flex;gap:6px;margin-bottom:8px}
.pvt{flex:1;padding:10px 8px;border:1.5px solid var(--border);background:#fff;border-radius:11px;font-family:inherit;font-weight:800;font-size:13px;color:var(--mid);cursor:pointer}
.pvt.on{background:linear-gradient(135deg,var(--teal),var(--teal2));border-color:var(--teal);color:#fff}
.paper{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 14px;box-shadow:0 3px 12px rgba(15,23,42,.07);margin-bottom:86px}
.pvimg{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:86px;box-shadow:0 3px 12px rgba(15,23,42,.07)}
.pvimg img{width:100%;display:block;border-radius:6px}
.pvbar{position:fixed;right:0;left:0;bottom:0;z-index:60;display:flex;gap:7px;padding:10px 12px;background:#fff;border-top:1.5px solid var(--border);box-shadow:0 -4px 14px rgba(15,23,42,.08)}
.pvbar .btn{flex:1;justify-content:center;padding:11px 6px}
.pvbar .btn.white{border:1.5px solid var(--border)}
@media print{.pvtabs,.pvbar{display:none!important}}

/* مكان حفظ النسخ الاحتياطية */
.loc{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:9px}
.loc-l{font-size:11.5px;font-weight:800;color:var(--mid)}
.loc-v{font-size:13px;font-weight:800;color:var(--teal2);margin-top:2px;word-break:break-all}
.loc-w{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 8px;margin-top:7px;line-height:1.6;font-weight:700}

/* محرّر المجموعة */
.gbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:8px 9px;margin-bottom:9px}
.gbar .btn.white{border:1.5px solid var(--border)}
.hint{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;margin-bottom:9px;line-height:1.6;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint .btn{padding:5px 9px;font-size:11.5px}
/* «تحديد الكل» داخل رأس المجموعة */
.acc-pick{background:none;border:none;font-size:15px;padding:2px 6px;cursor:pointer;margin-right:auto}
/* مساحة تحت قائمة المعاينة حتى لا يغطّيها شريط الإرسال */
.pvpad{height:86px}
/* مكتبة الصور */
.imgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgcard{background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:8px;text-align:center}
.imgcard img{width:100%;height:110px;object-fit:contain;border-radius:8px;background:#f8fafc;cursor:pointer}
.imgcode{font-weight:800;font-size:12.5px;color:var(--teal2);margin-top:5px;direction:ltr}
.imgname{font-size:11.5px;color:var(--mid);margin-top:1px}
.imgact{display:flex;justify-content:center;gap:4px;margin-top:3px}
.imgprev{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:8px;margin-bottom:11px;text-align:center}
.imgprev img{max-width:100%;max-height:220px;border-radius:8px}
.imgprev.sm{margin-top:7px;margin-bottom:0}
.imgprev.sm img{max-height:110px}
.code-fix{background:#f0fdfa;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:800;color:var(--teal2);direction:ltr;text-align:left}
/* صورة العنصر على بطاقته */
.cardpic{width:52px;height:52px;object-fit:cover;border-radius:9px;border:1px solid var(--border);flex-shrink:0}
/* اسم المريض فوق المعاينة */
.pvwho{margin-bottom:9px}
.pvwho label{margin-bottom:4px}
.idx{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;background:#f0fdfa;color:var(--teal2);border-radius:7px;font-size:12px;font-weight:800}

/* شارة نوع الوصفة + أزرار اختيار النوع */
.chip{display:inline-block;background:#ccfbf1;color:var(--teal2);border-radius:7px;padding:1px 7px;font-size:11px;font-weight:800;vertical-align:middle}
.segs{display:flex;gap:6px}
.segs.wrap{flex-wrap:wrap}
.segs.wrap .seg{flex:0 0 auto;padding:8px 11px;font-size:12.5px}
.seg{flex:1;padding:9px 6px;border:1.5px solid var(--border);background:#fff;border-radius:10px;font-family:inherit;font-weight:800;font-size:13px;color:var(--mid);cursor:pointer}
.seg.on{background:linear-gradient(135deg,var(--teal),var(--teal2));border-color:var(--teal);color:#fff}
.seg.new{border-style:dashed;color:var(--teal2)}

/* اختيار الحقول المرسلة */
.out-grp{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:8px 11px;margin-bottom:8px}
.out-t{font-weight:800;font-size:12.5px;margin-bottom:2px;color:var(--teal)}
.out-grp .chk-row{margin:5px 0;font-size:12.5px}

/* أسطر المتطلبات والممنوعات داخل البطاقات */
.req{font-size:11.5px;color:var(--teal);margin-top:3px;font-weight:700;line-height:1.5;white-space:pre-wrap}
.ban{font-size:11.5px;color:#b45309;margin-top:2px;font-weight:700;line-height:1.5;white-space:pre-wrap}
/* قيم الحقول الإضافية على بطاقة العنصر */
.xf{font-size:11.5px;color:var(--mid);margin-top:2px;line-height:1.5;white-space:pre-wrap}
.xf-l{font-weight:800;color:var(--light)}

/* المكتبة الجاهزة */
.lib-bar{position:sticky;top:64px;z-index:3;background:#f0fdfa;padding:8px 2px 10px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.lib-i{display:flex;align-items:flex-start;gap:9px;padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:13px;cursor:pointer}
.lib-i:last-child{border-bottom:none}
.lib-i input{width:19px;height:19px;accent-color:var(--teal);flex-shrink:0;margin-top:1px}
.lib-i.have{opacity:.45}
.lib-t{font-weight:800}
.lib-s{font-size:11.5px;color:var(--mid);font-weight:600}

/* توست */
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.toast.er{background:var(--red)}
@media print{.hdr,.toolbar,.cartbar,.hero,.hgrid,.hquick,.hbar{display:none!important}}
</style>
</head>
<body>

<div id="lock" class="scr"></div>

<div id="app" class="scr">
  <div class="hdr">
    <button class="hdr-b" id="hdr-back" onclick="goBack()" style="display:none" aria-label="رجوع">→</button>
    <div class="hdr-t"><span id="hdr-icon">💊🧪</span><span id="hdr-title">دليلي الطبي</span></div>
    <span class="grow"></span>
    <button class="hdr-b" id="hdr-grp" onclick="openDrawer()" aria-label="القائمة">☰</button>
    <button class="hdr-b" id="hdr-set" onclick="goPage('settings')" aria-label="الإعدادات">⚙️</button>
  </div>
  <div id="page"></div>
</div>

<!-- الدرج الجانبي: المجموعات في متناول اليد من أي صفحة -->
<div class="dw-bg" id="dw-bg" onclick="closeDrawer()"></div>
<aside class="dw" id="dw">
  <div class="dw-hd"><b>🧭 القائمة</b><button class="modal-x" onclick="closeDrawer()">✕</button></div>
  <div id="dw-body"></div>
</aside>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-hd"><b id="modal-title"></b><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="library.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
