plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'me.alaoufi.dalili'
    compileSdk 34

    defaultConfig {
        applicationId "me.alaoufi.dalili"
        minSdk 24
        targetSdk 34
        versionCode 49
        versionName "5.8"
    }

    /*
     * مفتاح توقيع ثابت داخل المستودع — وهذا ليس تفصيلًا تنظيميًّا.
     *
     * أندرويد يرفض تثبيت حزمةٍ فوق أخرى إن اختلف مفتاح توقيعها، ومهما
     * كان الرقم أعلى. وقد كان البناء يوقّع بمفتاح «debug» الذي يُولَّد
     * تلقائيًّا في `~/.android/debug.keystore` على **جهاز البناء** — فإن
     * بُني على جهازٍ آخر (أو بيئةٍ مؤقّتة تُعاد تهيئتها) وُلِّد مفتاحٌ
     * جديد، فصارت الحزمة لا تُثبَّت فوق سابقتها، ولا علاج إلا إلغاء
     * التثبيت — أي فقدان البيانات لمن لم ينسخها.
     *
     * وقع هذا فعلًا بين ٤٫٩ و٥٫٠. المفتاح هنا يمنع تكراره إلى الأبد.
     *
     * المفتاح في المستودع عمدًا: البناء يقع في بيئاتٍ مؤقّتة، ومفتاحٌ
     * خارجها يعني العودة إلى المشكلة نفسها. وهو تطبيق شخصي يُثبَّت من
     * مستودع صاحبه لا من متجر. من أراد سرّيّة المفتاح فليضعه في أسرار
     * البيئة ويقرأه هنا من متغيّر — والمهم ألّا يتغيّر.
     */
    signingConfigs {
        release {
            storeFile file('../keystore/dalili-release.jks')
            storePassword 'dalili2026'
            keyAlias 'dalili'
            keyPassword 'dalili2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// androidx.core و androidx.activity يجلبان نسختين مختلفتين من مكتبة Kotlin
// القياسية (1.6.21 و1.8.22) فتتكرّر الأصناف ويفشل البناء. توحيدها على 1.8.22
// يحلّ التعارض (حزمتا jdk7/jdk8 صارتا فارغتين منذ 1.8 ومحتواهما داخل الأساسية).
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // FileProvider (مشاركة الصورة الناتجة كملف) + ComponentActivity الحديثة
    // (اختيار الملف عند الاستيراد + زر الرجوع) بدون AppCompat/Material كاملة
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
}
